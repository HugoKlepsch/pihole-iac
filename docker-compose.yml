# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # Not necessary because using host networking - this fixes client IP resolution
    # ports:
    #   # DNS Ports
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   # Default HTTP Port
    #   - "80:80/tcp"
    #   - "443:443/tcp"
    #   - "5380:5380/tcp"
    #   - "53443:53443/tcp"
    network_mode: host
    environment:
      TZ: ${TZONE}
      # Per-deployment settings are set in .env.bash (see .env.bash.template).
      # With host networking, 'all' answers DNS on every host interface: fine behind
      # a home router, but an open resolver on a host with a public IP.
      FTLCONF_dns_listeningMode: ${FTLCONF_dns_listeningMode:-all}
      # Only passed to the container when set in .env.bash; otherwise Pi-hole's own
      # setting applies. Settings passed as env vars are read-only in the web UI.
      FTLCONF_dns_interface:
      FTLCONF_webserver_port:
      FTLCONF_ntp_ipv4_active:
      FTLCONF_ntp_ipv6_active:
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
    restart: unless-stopped
